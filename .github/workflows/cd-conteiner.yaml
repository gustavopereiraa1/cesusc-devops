name: Docker Image CICD

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

env:
  # Defina em Settings -> Secrets and variables -> Actions -> Variables
  IMAGEM_CESUSC: ${{ vars.DOCKERHUB_USERNAME }}/cesusc-devops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build and push the Docker image
        run: |
          set -eu
          docker build . --file Dockerfile --tag "$IMAGEM_CESUSC":"${{ github.sha }}"
          docker tag "$IMAGEM_CESUSC":"${{ github.sha }}" "$IMAGEM_CESUSC":latest
          docker push -a "$IMAGEM_CESUSC"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy docker-compose to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yaml
          target: /opt/cesusc-devops
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGEM_CESUSC
          script: |
            set -eu
            cd /opt/cesusc-devops
            echo "IMAGEM_CESUSC=$IMAGEM_CESUSC" > .env
            docker pull "$IMAGEM_CESUSC":latest
            docker compose down
            docker compose up -d
            docker system prune -a -f
